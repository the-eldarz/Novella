name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show repo files
        run: ls -la
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unpack project from zip
        run: |
          ZIP=$(find . -name '*.zip' -not -path './.git/*' | head -1)
          if [ -z "$ZIP" ]; then echo "В репозитории нет zip-файла с проектом"; ls -la; exit 1; fi
          echo "Using $ZIP"
          mkdir -p /tmp/src
          unzip -o "$ZIP" -d /tmp/src
          mkdir -p app/src/main/java/com/neighborvn
          cp /tmp/src/settings.gradle /tmp/src/build.gradle /tmp/src/gradle.properties .
          cp /tmp/src/app.gradle app/build.gradle
          cp /tmp/src/AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp /tmp/src/*.java app/src/main/java/com/neighborvn/
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: neighbor-vn-apk
          path: app/build/outputs/apk/debug/*.apk
